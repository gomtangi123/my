<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f14">
  <meta name="description" content="사진첩에 묻혀 있는 한 달을 1분 영상으로. 사진은 기기 밖으로 나가지 않아요.">
  <title>리플레이</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">리플레이</a>
    <button id="restart" class="link" hidden>처음부터</button>
  </header>

  <main>
    <!-- 1. 사진 고르기 -->
    <section id="step-pick" class="hero">
      <h1>사진첩에 묻혀 있는 한 달을<br><span class="accent">1분 영상</span>으로</h1>
      <p class="lead">사진을 한꺼번에 고르면 흔들린 사진, 비슷한 사진, 스크린샷은 알아서 빼고
        날짜별로 엮어서 세로 영상으로 만들어 드려요.</p>
      <div class="pick-buttons">
        <label class="btn primary big">
          사진 고르기
          <input id="file-input" type="file" accept="image/*" multiple hidden>
        </label>
        <label class="btn ghost" id="folder-label">
          폴더 통째로
          <input id="folder-input" type="file" webkitdirectory multiple hidden>
        </label>
      </div>
      <p class="note">🔒 사진은 이 기기 밖으로 나가지 않아요. 분석도, 영상 만들기도 모두 브라우저 안에서 해요.</p>
      <div id="drop-zone" class="drop">여기에 사진을 끌어다 놓아도 돼요</div>
    </section>

    <!-- 2. 분석 중 -->
    <section id="step-analyze" class="center" hidden>
      <h2 id="analyze-title">사진을 살펴보는 중…</h2>
      <div class="bar"><div id="analyze-bar"></div></div>
      <p id="analyze-count" class="muted"></p>
    </section>

    <!-- 3. 편집 -->
    <section id="step-edit" hidden>
      <div class="layout">
        <div class="preview-col">
          <div class="phone"><canvas id="stage"></canvas></div>
          <div class="controls">
            <button id="play" class="btn round" aria-label="재생">▶</button>
            <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="재생 위치">
            <span id="clock" class="muted mono">0:00 / 0:00</span>
          </div>
          <button id="export" class="btn primary wide">영상 만들기</button>
          <div id="export-status" class="status" hidden>
            <div class="bar"><div id="export-bar"></div></div>
            <p id="export-text" class="muted"></p>
          </div>
          <div id="result" class="result" hidden>
            <video id="result-video" controls playsinline></video>
            <div class="row">
              <a id="download" class="btn primary">저장하기</a>
              <button id="share" class="btn ghost" hidden>공유하기</button>
            </div>
            <p id="result-note" class="muted small"></p>
          </div>
        </div>

        <div class="settings-col">
          <p id="summary" class="summary"></p>
          <p id="date-warning" class="warning" hidden></p>

          <div class="field">
            <span class="label">기간</span>
            <div class="chips" id="period">
              <button data-value="all" class="chip on">전체</button>
              <button data-value="month" class="chip">최근 한 달</button>
              <button data-value="custom" class="chip">직접 지정</button>
            </div>
            <div id="custom-range" class="row" hidden>
              <input id="from" type="date"> <span class="muted">~</span> <input id="to" type="date">
            </div>
          </div>

          <div class="field">
            <span class="label">분위기</span>
            <div class="chips" id="mood"></div>
          </div>

          <div class="field">
            <label class="label" for="title">제목</label>
            <input id="title" type="text" maxlength="30" placeholder="자동">
            <input id="sub" type="text" maxlength="40" placeholder="부제 (자동)">
          </div>

          <div class="field">
            <label class="label" for="max-count">최대 사진 수 <b id="max-count-value"></b></label>
            <input id="max-count" type="range" min="5" max="60" step="1" value="30">
          </div>

          <div class="field">
            <span class="label">배경음악 <span class="muted small">(내가 가진 음악 파일)</span></span>
            <div class="row">
              <label class="btn ghost small">
                <span id="music-name">음악 고르기</span>
                <input id="music-input" type="file" accept="audio/*" hidden>
              </label>
              <button id="music-clear" class="link" hidden>빼기</button>
            </div>
            <label class="check" id="fit-music-label" hidden>
              <input id="fit-music" type="checkbox" checked> 영상 길이를 음악에 맞추기
            </label>
          </div>

          <div class="field">
            <span class="label">들어간 사진 <span class="muted small">눌러서 그 장면으로 · ◀ ▶ 순서 · ✕ 빼기</span></span>
            <div id="kept" class="grid"></div>
          </div>

          <details id="rejected-box" class="field">
            <summary id="rejected-summary">뺀 사진</summary>
            <div id="rejected" class="grid"></div>
          </details>
        </div>
      </div>
    </section>
  </main>

  <script src="js/exif.js"></script>
  <script src="js/select.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/analyze.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
