  - key: tur_super_lig
    name_ko: 튀르키예 쉬페르리그
    enabled: true
    type: league
    region: europe
    timezone: Europe/Istanbul
    season_format: cross_year
    priority: 2
    api_football: {id: 203, match: {country: Turkey, names: ["Süper Lig", "Super Lig"]}}
    football_data: {code: T1}

  - key: sco_premiership
    name_ko: 스코틀랜드 프리미어십
    enabled: true
    type: league
    region: europe
    timezone: Europe/London
    season_format: cross_year
    priority: 2
    api_football: {id: 179, match: {country: Scotland, names: ["Premiership"]}}
    football_data: {code: SC0}

  # ── 아시아 ──

  - key: kor_k_league_1
    name_ko: K리그1
    enabled: true
    type: league
    region: asia
    timezone: Asia/Seoul
    season_format: calendar_year
    priority: 1
    api_football: {id: 292, match: {country: South-Korea, names: ["K League 1"]}}
    # 동점 시 다득점이 득실차보다 먼저. 팀당 33경기 후 상위 6팀(파이널 A)은 승점과 관계없이 하위 6팀(파이널 B) 위에 놓인다.
    standings: {tiebreak: [points, gf, gd], split: {after_games: 33, top: 6}}
    thesportsdb: {id: 4689}

  - key: jpn_j1_league
    name_ko: J1리그
    enabled: true
    type: league
    region: asia
