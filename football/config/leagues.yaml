# 대상 대회 목록 — 리그 추가/삭제는 이 파일만 수정한다.
#
# api_football.match: API-Football /leagues 응답에서 대회를 찾는 기준 (국가명 + 대회명 후보).
#   실제 리그 ID는 0단계 조사 스크립트(backend/scripts/survey_api_football.py)가 찾아서
#   README와 data/survey/에 기록한다. 확인된 ID는 api_football.id 에 채워 넣는다.
# priority: 호출 한도가 부족할 때 낮은 숫자부터 먼저 수집한다.
# standings: 순위 규칙 (없으면 승점 → 득실차 → 다득점). tiebreak 는 points/gd/gf 순서 목록,
#   split 은 스플릿 리그용 {after_games: 정규 라운드 팀당 경기 수, top: 상위 그룹 팀 수}.
#   상대 전적으로 동점을 가르는 리그(라리가·세리에 A 등)는 아직 반영하지 않는다.
# 데이터 소스 (0단계 조사 결과, README 참고):
#   football_data: Football-Data.co.uk CSV (code = 리그 파일 코드, extra_file = new/{이름}.csv 추가 리그 파일)
#   thesportsdb:   TheSportsDB 리그 ID (K리그1·ACL 일정·결과)
#   api_football:  API-Football 리그 ID (계정 정지 상태 — 복구되면 선수·부상 정보용)
# season_format: cross_year(8월~5월) / calendar_year(1월~12월). 최종 판단은 API 응답의 시작·종료일로 한다.

leagues:
  # ── 유럽 4대 리그 ──
  - key: eng_premier_league
    name_ko: 잉글랜드 프리미어리그
    enabled: true
    type: league
    region: europe
    timezone: Europe/London
    season_format: cross_year
    priority: 1
    api_football: {id: 39, match: {country: England, names: ["Premier League"]}}
    football_data: {code: E0}

  - key: esp_la_liga
    name_ko: 스페인 라리가
    enabled: true
    type: league
    region: europe
    timezone: Europe/Madrid
    season_format: cross_year
    priority: 1
    api_football: {id: 140, match: {country: Spain, names: ["La Liga", "LaLiga", "Primera Division"]}}
    football_data: {code: SP1}

  - key: ger_bundesliga
    name_ko: 독일 분데스리가
    enabled: true
    type: league
    region: europe
    timezone: Europe/Berlin
    season_format: cross_year
    priority: 1
    api_football: {id: 78, match: {country: Germany, names: ["Bundesliga", "1. Bundesliga"]}}
    football_data: {code: D1}

  - key: ita_serie_a
    name_ko: 이탈리아 세리에 A
    enabled: true
    type: league
    region: europe
    timezone: Europe/Rome
    season_format: cross_year
    priority: 1
    api_football: {id: 135, match: {country: Italy, names: ["Serie A"]}}
    football_data: {code: I1}

  # ── 유럽 중소 리그 ──

  - key: eng_championship
