  - key: bel_pro_league
    name_ko: 벨기에 프로리그
    enabled: true
    type: league
    region: europe
    timezone: Europe/Brussels
    season_format: cross_year
    priority: 2
    api_football: {id: 144, match: {country: Belgium, names: ["Jupiler Pro League", "Pro League", "First Division A"]}}
